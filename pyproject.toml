[project]
name = "t2lgepa"
version = "0.1.0"
description = "Head-to-head harness for Text-to-LoRA vs GEPA on a small model"
requires-python = ">=3.10,<3.12"
dependencies = [
    "pyyaml>=6.0",
    "numpy>=1.26",
    "httpx>=0.27",
    "datasets>=2.20",
    "gepa>=0.1.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "respx>=0.21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/t2lgepa"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
