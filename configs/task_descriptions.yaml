gsm8k: >-
  This task tests mathematical reasoning. Read the word problem, work through the
  quantities step by step, and finish with the final numeric answer on its own line
  as '#### <number>'.
arc_challenge: >-
  This task tests science knowledge in a multiple-choice format. Read the question and
  the four options, reason about which one is scientifically correct, and finish with
  'The answer is (X).' where X is one of A, B, C, D.
