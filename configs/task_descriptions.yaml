# Paper-time task descriptions, taken from the T2L repo's own eval config
# (configs/hyper_lora_decontam_lol_tasks.yaml). Do not paraphrase: the hypernetwork
# is sensitive to this text.

gsm8k: >-
  You will be tasked with interpreting mathematical situations described in words. The goal is to
  use logical reasoning and calculations to determine the numerical answers based on the context
  provided.
arc_challenge: >-
  This task is about analyzing questions which examine your grasp of scientific ideas. You must
  connect conceptual knowledge with practical examples from geology, ecology and environmental
  changes.
arc_easy: >-
  Your job is to discern which information best answers a posed question, focusing on practical
  examples and scientific principles. This requires a strong grasp of underlying concepts in
  ecology or physics.
boolq: >-
  Analyze the given details about various subjects, including movies, sports, and television
  shows. Your role is to confirm whether certain claims are true or false.
hellaswag: >-
  This task revolves around completing an unfinished text by selecting an ending that matches its
  tone and context. It requires you to think critically about how narratives develop and conclude
  effectively.
openbookqa: >-
  Analyze the provided statements carefully and determine which one best fits into the context of
  the passage. This requires comprehension skills and the ability to make logical inferences.
piqa: >-
  You will explore practical questions and select an answer that presents a logical and widely
  accepted approach to solve a given problem or complete a task successfully.
winogrande: >-
  In this exercise, you need to read short narratives and discern which person or object fits best
  within the context of the sentence.
